databases:
  - name: antonio-bellanova-db
    databaseName: bellanova_luxury
    user: bellanova
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: antonio-bellanova-luxury
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    releaseCommand: npm run db:migrate && npm run db:seed
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: antonio-bellanova-db
          property: connectionString
      - key: APP_URL
        value: https://antonio-bellanova-luxury.onrender.com
      - key: ADMIN_EMAILS
        value: antoniobellanova1812@gmail.com,belllanovaantonio1@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
