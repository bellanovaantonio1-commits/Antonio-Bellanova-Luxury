services:
  - type: web
    name: antonio-bellanova-luxury
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    releaseCommand: npm run db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAILS
        value: antoniobellanova1812@gmail.com,belllanovaantonio1@gmail.com
